<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ashby</title>
<style>
  :root {
    --bg: #fbfaf8; --panel: #fff; --ink: #1c1b19; --muted: #6b6862; --line: #e5e1da;
    --accent: #3b6ea5; --good: #2f7d4f; --warn: #a8641b; --bad: #9c3b3b;
    --chip: #f0ece5; --hover: #f6f3ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a; --panel: #1e1f22; --ink: #e8e6e3; --muted: #9a968e; --line: #2e3035;
      --accent: #7fa8d6; --good: #6cc08a; --warn: #d9a05b; --bad: #d97a7a;
      --chip: #2a2c30; --hover: #232528;
    }
  }
  * { box-sizing: border-box; }
  /* .bar sets display:flex, and an author rule beats the UA [hidden] rule whatever
     its specificity — without this, hiding an element does nothing. */
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 13px/1.45 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 10; background: var(--bg);
           border-bottom: 1px solid var(--line); padding: 12px 16px 10px; }
  h1 { margin: 0 0 9px; font-size: 14px; font-weight: 600; }
  h1 span { color: var(--muted); font-weight: 400; margin-left: 8px; font-size: 12px; }
  .bar { display: flex; gap: 7px; align-items: center; flex-wrap: wrap; }
  .tab { border: 1px solid var(--line); background: var(--panel); color: var(--ink);
         padding: 4px 10px; border-radius: 999px; cursor: pointer; font: inherit; font-size: 12px; }
  .tab[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  input[type=search] { flex: 1; min-width: 150px; padding: 5px 9px; font: inherit;
    border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--ink); }

  table { border-collapse: collapse; width: 100%; }
  /* The whole head is sticky, not each th: it is two rows now, and per-cell
     stickiness would need a hand-measured top for the second one. */
  thead { position: sticky; top: 71px; z-index: 5; }
  thead th { background: var(--bg);
    text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); font-weight: 600; padding: 8px 10px 5px;
    cursor: pointer; white-space: nowrap; user-select: none; }
  thead tr.ranges th { cursor: default; padding: 0 6px 7px 10px; text-transform: none;
    letter-spacing: 0; font-weight: 400; border-bottom: 1px solid var(--line); vertical-align: top; }
  .rng-pair { display: flex; flex-direction: column; gap: 3px; }
  input.rng { width: 48px; padding: 2px 4px; font: inherit; font-size: 11px;
    font-variant-numeric: tabular-nums; border: 1px solid var(--line); border-radius: 4px;
    background: var(--panel); color: var(--ink); -moz-appearance: textfield; }
  input.rng::-webkit-inner-spin-button, input.rng::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input.rng::placeholder { color: var(--muted); opacity: .7; }
  input.rng.on { border-color: var(--accent); }
  #clearranges { font-size: 11px; padding: 2px 8px; }
  thead th:hover { color: var(--ink); }
  thead th .caret { opacity: 0; margin-left: 3px; }
  thead th.sorted { color: var(--ink); }
  thead th.sorted .caret { opacity: 1; }
  tbody tr.r { border-bottom: 1px solid var(--line); cursor: pointer; }
  tbody tr.r:hover td, tbody tr.r.open td { background: var(--hover); }
  td { padding: 7px 10px; vertical-align: top; }
  td.num { font-variant-numeric: tabular-nums; font-weight: 600; width: 58px; }
  td.num.none { color: var(--muted); font-weight: 400; }
  td.value { border-left: 1px solid var(--line); }
  td.num .sub { font-variant-numeric: tabular-nums; }
  .s-hi { color: var(--good); } .s-mid { color: var(--warn); } .s-lo { color: var(--muted); }
  td.title { font-weight: 600; max-width: 360px; }
  td.co, td.loc, td.pay, td.date { color: var(--muted); white-space: nowrap; }
  /* Locations wrap. Multi-city postings run past 100 characters, and on one line the
     longest set the column's width and pushed every column after it off the page. */
  td.loc { white-space: normal; width: 220px; max-width: 220px; overflow-wrap: anywhere; }
  td.pay.has { color: var(--good); }
  td.pay.est { font-style: italic; }
  td.pay.est .sub { font-style: normal; white-space: normal; max-width: 170px; }
  td.date { font-variant-numeric: tabular-nums; }
  td.date.stale { color: var(--warn); }
  td.st { width: 1%; }
  .state { font-size: 10px; letter-spacing: .07em; text-transform: uppercase;
           padding: 2px 7px; border-radius: 4px; white-space: nowrap; display: inline-block; }
  .st-queued { background: var(--good); color: #fff; }
  .st-applied { background: var(--accent); color: #fff; }
  .st-opened { background: var(--warn); color: #fff; opacity: .7; }
  .st-judged { background: var(--warn); color: #fff; }
  .st-staged { background: var(--accent); color: #fff; opacity: .65; }
  .st-unseen { background: var(--chip); color: var(--muted); }
  .st-dismissed { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .sub { color: var(--muted); font-size: 11px; display: block; font-weight: 400; }

  tr.detail { display: none; }
  tr.detail.open { display: table-row; }
  tr.detail td { padding: 4px 16px 18px 24px; border-bottom: 1px solid var(--line);
                 background: var(--hover); }
  .panes { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
           gap: 0 28px; align-items: start; }
  .pane { min-width: 0; }
  .pane + .pane { border-left: 1px solid var(--line); padding-left: 28px; }
  @media (max-width: 1100px) {
    .panes { grid-template-columns: 1fr; gap: 18px; }
    .pane + .pane { border-left: 0; padding-left: 0; padding-top: 16px;
                    border-top: 1px solid var(--line); }
  }
  .pane h4 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase;
             letter-spacing: .07em; color: var(--muted); font-weight: 600; }
  .pane h4 + h4, .pane ul + h4, .pane p + h4 { margin-top: 18px; }
  .desc { white-space: pre-wrap; max-height: 340px; overflow-y: auto;
          color: var(--muted); font-size: 12px; padding-right: 8px; }
  .acts { margin-top: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  button.act { border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    padding: 5px 11px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 12px; }
  button.act:hover { background: var(--chip); }
  button.act.primary { background: var(--good); border-color: var(--good); color: #fff; }
  button.act.drop { color: var(--bad); }
  a.lnk { color: var(--accent); text-decoration: none; font-size: 12px; }
  a.lnk:hover { text-decoration: underline; }
  .meta { color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  #more { display: block; margin: 18px auto 40px; }
</style>
</head>
<body>
<header>
  <h1>ashby <span id="stamp"></span></h1>
  <div class="bar">
    <button class="tab" data-f="remote" aria-pressed="false">remote only</button>
    <button class="tab" data-f="scored" aria-pressed="false">scored only</button>
    <input type="search" id="q" placeholder="filter by title, company, team…">
    <button class="tab" id="refresh">refresh</button>
  </div>
</header>

<table>
  <thead>
    <tr>
      <th data-s="fitness" title="Jev's answer to one question, given the whole posting and your resume: is the candidate qualified for this job? Probability of yes. The score value is built on.">fitness <span class="caret">▾</span></th>
      <th data-s="fresh" title="How much of its value the posting still has. Halves every 7 days: listed today 1.00, a week old 0.50, a month 0.05.">fresh <span class="caret">▾</span></th>
      <th data-s="value" class="sorted" title="Geometric mean of fitness (min-maxed across the rows shown) and fresh — how good the match is, and whether it is still worth chasing. Weak on either drags it down. Blank until both exist.">value <span class="caret">▾</span></th>
      <th data-s="state">state <span class="caret">▾</span></th>
      <th data-s="title">title <span class="caret">▾</span></th>
      <th data-s="slug">company <span class="caret">▾</span></th>
      <th data-s="location">location <span class="caret">▾</span></th>
      <th data-s="payNum">pay <span class="caret">▾</span></th>
    </tr>
    <tr class="ranges" title="Show only rows inside these bounds (inclusive). A row with no value for a bounded column is hidden.">
      <th data-r="fitness"></th><th data-r="fresh"></th><th data-r="value"></th>
      <th><button class="tab" id="clearranges" hidden>clear ranges</button></th>
      <th></th><th></th><th></th><th></th>
    </tr>
  </thead>
  <tbody id="rows"></tbody>
</table>
<button class="tab" id="more" hidden>show more</button>

<script>
let JOBS = [], TOTAL = 0, term = "", sortKey = "value", sortDir = -1, limit = 5000;

// Every row is fetched and sorted, but only this many are painted. 2,871 rows is
// 48,000 DOM nodes and ~290ms of layout on every render — the browser stall. The cap
// is applied AFTER sorting and filtering, so it only ever hides the tail of the list
// you are already looking at. (Unlike the old server-side slice, which cut on a
// different ordering than the page displayed and hid every fresh posting.)
const PAINT_STEP = 300;
let painted = PAINT_STEP;
const opts = { remote: false, scored: false };

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const cls = n => n == null ? 'none' : n >= 0.6 ? 's-hi' : n >= 0.3 ? 's-mid' : 's-lo';
// A number that has not been computed shows "-", never 0 — they mean different things.
const num = n => n == null ? '—' : n.toFixed(2);

// "$155K - $245K" -> 245000, so the pay column sorts numerically and blanks sink.
function parseTop(s) {
  if (!s) return null;
  const nums = [...String(s).matchAll(/([\d.]+)\s*([kK])?/g)]
    .map(m => Number(m[1]) * (m[2] ? 1000 : 1)).filter(n => n > 0);
  return nums.length ? Math.max(...nums) : null;
}

async function load() {
  const q = new URLSearchParams({ limit: String(limit) });
  for (const k of ['remote', 'scored']) if (opts[k]) q.set(k, '1');

  let d;
  try { d = await (await fetch('/api/board?' + q)).json(); }
  catch {
    document.getElementById('rows').innerHTML =
      '<tr><td colspan="8" class="empty">Could not reach the server — is <b>node ui.js</b> still running?</td></tr>';
    return;
  }

  JOBS = d.jobs.map(j => ({ ...j, payNum: parseTop(j.pay) }));
  TOTAL = d.total;
  document.getElementById('stamp').textContent =
    d.total + ' postings · ' + d.counts.fitness +
    ' fitness · ' + d.counts.value + ' ranked · ' + d.counts.queued + ' queued · ' + d.counts.applied + ' submitted';
  painted = PAINT_STEP;
  render();
}

/** Painting more is a re-render, not a refetch — every row is already here. */
function updateMore(shown, matching) {
  const more = document.getElementById('more');
  more.hidden = shown >= matching;
  more.textContent = 'show more (' + shown + ' of ' + matching + ')';
}

// ---- score ranges --------------------------------------------------------
//
// A min and a max under each score column. Client-side, like the search box: every
// row is already here, so narrowing needs no refetch. Keyed on the field each column
// draws. A bound stored for a column that no longer exists (similarity, dropped
// 2026-10-02) is simply never read.
//
// Remembered in this browser only. Storage can be unavailable (private window,
// blocked site data), and then the ranges simply start empty.
const RANGE_KEYS = ['fitness', 'fresh', 'value'];
const RANGE_STORE = 'ashby.ranges';
let ranges = {};
try { ranges = JSON.parse(localStorage.getItem(RANGE_STORE) || '{}') || {}; } catch { ranges = {}; }
const saveRanges = () => { try { localStorage.setItem(RANGE_STORE, JSON.stringify(ranges)); } catch {} };
const bound = (k, b) => ranges[k]?.[b] ?? null;
const anyRange = () => RANGE_KEYS.some(k => bound(k, 'min') != null || bound(k, 'max') != null);

// Compared at the two decimals the cell shows, so a row reading 0.60 is inside
// "min 0.6" rather than excluded for being 0.598 underneath. Inclusive both ends.
// A row with no value for a bounded column is outside it: unscored is not in range.
function inRanges(j) {
  for (const k of RANGE_KEYS) {
    const lo = bound(k, 'min'), hi = bound(k, 'max');
    if (lo == null && hi == null) continue;
    if (j[k] == null) return false;
    const v = Math.round(j[k] * 100) / 100;
    if (lo != null && v < lo) return false;
    if (hi != null && v > hi) return false;
  }
  return true;
}

function paintRangeInputs() {
  for (const th of document.querySelectorAll('tr.ranges th[data-r]')) {
    const k = th.dataset.r;
    th.innerHTML = '<div class="rng-pair">' + ['min', 'max'].map(b =>
      '<input class="rng" type="number" step="0.05" min="0" max="1" inputmode="decimal"' +
      ' data-k="' + k + '" data-b="' + b + '" placeholder="' + b + '" aria-label="' + k + ' ' + b + '"' +
      ' value="' + (bound(k, b) ?? '') + '">').join('') + '</div>';
  }
  markRanges();
}
function markRanges() {
  for (const i of document.querySelectorAll('input.rng')) i.classList.toggle('on', i.value.trim() !== '');
  document.getElementById('clearranges').hidden = !anyRange();
}

function visible() {
  const rows = JOBS.filter(j => (!term ||
    [j.title, j.slug, j.department, j.team, j.location].filter(Boolean).join(' ').toLowerCase().includes(term))
    && inRanges(j));
  rows.sort((a, b) => {
    const x = a[sortKey], y = b[sortKey];
    // Nulls always sink, whichever way the column is sorted.
    if (x == null && y == null) return 0;
    if (x == null) return 1;
    if (y == null) return -1;
    const c = typeof x === 'number' && typeof y === 'number' ? x - y : String(x).localeCompare(String(y));
    return c * sortDir;
  });
  return rows;
}

// Published pay as before. Where a posting publishes none, a levels.fyi estimate from
// `npm run levels` — marked "est.", with where it came from, and never in payNum: an
// estimate is what people at the company reported, not what this posting offers, so
// sorting by pay ranks published pay only.
const k$ = n => '$' + Math.round(n / 1000) + 'K';
function payCell(j) {
  // Pay stated in the description is the posting's own pay, just not in its pay field:
  // drawn as pay, with the source named. The sentence is in the expanded row.
  if (j.pay && j.payFrom === 'description') {
    return '<td class="pay has" title="Stated in the job description — the posting\'s pay field is empty. Expand the row for the sentence.">' +
      esc(j.pay) + '</td>';
  }
  if (j.pay || !j.payEst) return '<td class="pay' + (j.pay ? ' has' : '') + '">' + esc(j.pay || '—') + '</td>';
  const e = j.payEst;
  const fig = e.low != null && e.high != null && e.low !== e.high ? k$(e.low) + '–' + k$(e.high) : k$(e.base);
  const what = e.kind === 'all levels' ? 'all levels' : e.level;
  const tip = 'levels.fyi: ' + (e.company || 'this company') + ', ' +
    (e.kind === 'all levels' ? 'US base salary across all levels (25th–75th percentile, median ' + k$(e.base) + ')'
      : 'average US base salary at ' + e.level + (e.kind === 'exact' ? ' (exact title)' : ' (same seniority)')) +
    ', from ' + e.count + ' submission' + (e.count === 1 ? '' : 's') +
    (e.total != null ? '; total comp ' + k$(e.total) : '') +
    '. An estimate from what people at the company reported — not this posting\'s pay.';
  return '<td class="pay est" title="' + esc(tip) + '">est. ' + fig +
    '<span class="sub">' + esc(what) + ' · n=' + e.count + '</span></td>';
}

function render() {
  const all = visible();
  const body = document.getElementById('rows');
  if (!all.length) {
    body.innerHTML = '<tr><td colspan="8" class="empty">' +
      (JOBS.length && anyRange() ? 'nothing inside these ranges' : 'nothing here') + '</td></tr>';
    updateMore(0, 0);
    return;
  }

  // Sorted and filtered over every row, then capped for painting.
  const rows = all.slice(0, painted);
  updateMore(rows.length, all.length);

  body.innerHTML = rows.map(j => {

    return '<tr class="r" data-id="' + esc(j.id) + '">' +
        '<td class="num ' + cls(j.fitness) + '">' + num(j.fitness) + '</td>' +
        '<td class="num ' + (j.fresh == null ? 'none' : cls(j.fresh)) + '">' +
          (j.fresh == null ? '—' : j.fresh.toFixed(2)) +
          (j.daysLive == null ? '' : '<span class="sub">' + j.daysLive + 'd</span>') + '</td>' +
        '<td class="num value ' + (j.value == null ? 'none' : cls(j.value)) + '">' +
          (j.value == null ? '—' : j.value.toFixed(2)) + '</td>' +
        '<td class="st"><span class="state st-' + j.state + '">' + j.state + '</span></td>' +
        '<td class="title">' + esc(j.title) + '</td>' +
        '<td class="co">' + esc(j.slug) + '</td>' +
        '<td class="loc">' + esc(j.location || '?') + '</td>' +
        payCell(j) +
      '</tr>' +
      '<tr class="detail" data-for="' + esc(j.id) + '"><td colspan="8"></td></tr>';
  }).join('');
}

/*
 * The expanded pane, built when a row is opened rather than for all 600 rows on
 * every render. It used to carry a full job description and requirement list per
 * row, hidden behind CSS — 5.1 MB of a 5.8 MB board response, rebuilt as HTML on
 * every keystroke in the search box.
 */
function paneHtml(j, d) {
  const fitLine = j.fitness == null
    ? '<p class="meta fitline">Not scored yet — send it to the scorers, then run <b>npm run fitness</b>.</p>'
    : '<p class="fitline"><b class="' + cls(j.fitness) + '">' + j.fitness.toFixed(2) + '</b> ' +
      '<span class="meta">Jev\'s probability that you are qualified for this job, from the posting and your resume.</span></p>';

  const act = j.state === 'applied'
    ? '<span class="meta">submitted</span>'
    : j.state === 'opened'
      ? '<span class="meta">opened in apply.js, not submitted</span>'
    : j.state === 'queued'
      ? '<button class="act drop" data-q="0">remove from queue</button>'
      : '<button class="act primary" data-q="1">queue for application</button>';
  const dismissBtn = j.state === 'dismissed'
    ? '<button class="act" data-dismiss="0">un-dismiss</button>'
    : '<button class="act" data-dismiss="1">not interested</button>';
  const stageBtn = j.state === 'staged'
    ? '<span class="meta">staged for the next scorer run</span>'
    : j.fitness == null
      ? '<button class="act" data-stage="1">send to scorers</button>' : '';

  return '<div class="panes">' +
      '<div class="pane">' +
        '<h4>Fitness — qualified for this job?</h4>' + fitLine +
        (d.payText ? '<h4>Pay, from the description</h4><p class="meta paytext">' + esc(d.payText) + '</p>' : '') +
        '<div class="acts">' + act + stageBtn + dismissBtn +
          (d.applyUrl ? '<a class="lnk" href="' + esc(d.applyUrl) + '" target="_blank" rel="noopener">application ↗</a>' : '') +
          (d.jobUrl ? '<a class="lnk" href="' + esc(d.jobUrl) + '" target="_blank" rel="noopener">posting ↗</a>' : '') +
        '</div>' +
        '<div class="acts"><span class="meta">' + esc(d.department || '?') + ' / ' + esc(d.team || '?') +
          ' · ' + esc(d.workplaceType || '?') + ' · ' + esc(d.employmentType || '?') +
        '</span></div>' +
      '</div>' +
      '<div class="pane"><h4>Job description</h4>' +
        '<div class="desc">' + esc(d.description || '(not stored)') + '</div>' +
      '</div>' +
    '</div>';
}

// Detail is fetched once per posting and kept, so collapsing and re-expanding a row
// costs nothing.
const detailCache = new Map();
async function fillPane(id) {
  const cell = document.querySelector('tr.detail[data-for="' + CSS.escape(id) + '"] td');
  if (!cell || cell.dataset.filled === '1') return;
  const j = JOBS.find(r => r.id === id);
  if (!j) return;
  cell.innerHTML = '<p class="meta">loading…</p>';
  try {
    if (!detailCache.has(id)) {
      detailCache.set(id, await (await fetch('/api/detail?id=' + encodeURIComponent(id))).json());
    }
    cell.innerHTML = paneHtml(j, detailCache.get(id));
    cell.dataset.filled = '1';
  } catch {
    cell.innerHTML = '<p class="meta">could not load this posting\'s detail</p>';
  }
}

document.getElementById('rows').addEventListener('click', async (e) => {
  const holder = e.target.closest('tr.detail') || e.target.closest('tr.r');
  const id = holder?.dataset.for ?? holder?.dataset.id;

  const qb = e.target.closest('button[data-q]');
  if (qb) {
    qb.disabled = true;
    await fetch('/api/queue', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id, queued: qb.dataset.q === '1' }) });
    return load();
  }
  const db = e.target.closest('button[data-dismiss]');
  if (db) {
    db.disabled = true;
    await fetch('/api/dismiss', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id, dismissed: db.dataset.dismiss === '1' }) });
    return load();
  }
  const sb = e.target.closest('button[data-stage]');
  if (sb) {
    sb.disabled = true; sb.textContent = 'sending…';
    await fetch('/api/stage', { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id }) });
    return load();
  }
  if (e.target.closest('a')) return;
  const r = e.target.closest('tr.r');
  if (!r) return;
  r.classList.toggle('open');
  const d = document.querySelector('tr.detail[data-for="' + CSS.escape(r.dataset.id) + '"]');
  d?.classList.toggle('open');
  if (d?.classList.contains('open')) fillPane(r.dataset.id);
});

for (const th of document.querySelectorAll('thead th[data-s]')) {
  th.addEventListener('click', () => {
    const k = th.dataset.s;
    if (sortKey === k) sortDir = -sortDir;
    else { sortKey = k; sortDir = ['fitness', 'fresh', 'value', 'payNum'].includes(k) ? -1 : 1; }
    for (const o of document.querySelectorAll('thead th')) o.classList.remove('sorted');
    th.classList.add('sorted');
    th.querySelector('.caret').textContent = sortDir === -1 ? '▾' : '▴';
    render();
  });
}
for (const t of document.querySelectorAll('.tab[data-f]')) {
  t.addEventListener('click', () => {
    const k = t.dataset.f;
    opts[k] = !opts[k];
    for (const o of document.querySelectorAll('.tab[data-f]')) o.setAttribute('aria-pressed', String(!!opts[o.dataset.f]));
    limit = 5000;
    load();
  });
}
// Debounced. render() rebuilds the whole table, and calling it synchronously on
// every keystroke is what made typing in this box feel like the machine had stalled.
let typingTimer = null;
document.getElementById('q').addEventListener('input', e => {
  term = e.target.value.toLowerCase().trim();
  clearTimeout(typingTimer);
  typingTimer = setTimeout(() => { painted = PAINT_STEP; render(); }, 120);
});
// Debounced for the same reason as the search box. Anything that is not a number
// clears that bound rather than filtering on NaN.
let rangeTimer = null;
document.querySelector('tr.ranges').addEventListener('input', e => {
  const i = e.target.closest('input.rng');
  if (!i) return;
  const raw = i.value.trim();
  const n = raw === '' ? null : Number(raw);
  ranges[i.dataset.k] = { ...ranges[i.dataset.k], [i.dataset.b]: Number.isFinite(n) ? n : null };
  saveRanges();
  markRanges();
  clearTimeout(rangeTimer);
  rangeTimer = setTimeout(() => { painted = PAINT_STEP; render(); }, 120);
});
document.getElementById('clearranges').addEventListener('click', () => {
  ranges = {};
  saveRanges();
  paintRangeInputs();
  painted = PAINT_STEP;
  render();
});
paintRangeInputs();

document.getElementById('refresh').addEventListener('click', load);
document.getElementById('more').addEventListener('click', () => { painted += PAINT_STEP; render(); });

load();
</script>
</body>
</html>
